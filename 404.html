<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Page Not Found — Stackly Government Services Portal. The page you're looking for doesn't exist." />
  <title>404 — Page Not Found | Stackly</title>
  <link rel="icon" type="image/webp" href="assets/Logo11.webp" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <style>
    body { background: var(--bg-white); }
    .error-page { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; text-align: center; position: relative; overflow: hidden; }
    .error-bg-grid { position: absolute; inset: 0; background-image: linear-gradient(var(--border-light) 1px, transparent 1px), linear-gradient(90deg, var(--border-light) 1px, transparent 1px); background-size: 60px 60px; }
    .error-code { font-family: var(--font-heading); font-size: clamp(4.5rem, 10vw, 7.5rem); font-weight: 900; line-height: 1; background: var(--grad-primary); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; position: relative; z-index: 1; animation: float1 4s ease-in-out infinite; }
    .error-icon { font-size: 3rem; background: var(--grad-primary); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 1rem; }
    .error-title { font-family: var(--font-heading); font-size: clamp(1.2rem, 3vw, 1.8rem); font-weight: 800; margin-bottom: 0.75rem; position: relative; z-index: 1; }
    .error-desc { font-size: var(--fs-sm); color: var(--txt-muted); max-width: 420px; line-height: 1.7; margin-bottom: 1.5rem; position: relative; z-index: 1; }
    .error-actions { display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center; position: relative; z-index: 1; }
  </style>
</head>
<body>
<div id="preloader" role="status" aria-live="polite" aria-label="Loading Stackly Portal">
  <div class="preloader-content">
    <div class="preloader-logo-wrap">
      <div class="preloader-logo-ring"></div>
      <img src="assets/Logo11.webp" alt="Stackly Logo" class="preloader-logo" />
    </div>
    <div class="preloader-bar-wrap">
      <div class="preloader-bar"><div class="preloader-bar-inner"></div></div>
      <span class="preloader-text">Loading Stackly...</span>
    </div>
  </div>
</div>

<main class="error-page">
  <div class="error-bg-grid" aria-hidden="true"></div>
  <div class="error-code">404</div>
  <div class="error-icon"><i class="fa-solid fa-compass"></i></div>
  <h1 class="error-title">Oops! Page Not Found</h1>
  <p class="error-desc">The page you're looking for seems to have gone missing. It may have been moved, deleted, or you may have typed the address incorrectly. Let's get you back on track.</p>

  <div class="error-actions">
    <a href="index.html" class="btn btn-primary btn-lg"><i class="fa-solid fa-house"></i> Back to Home</a>
    <a href="#" onclick="window.history.back(); return false;" class="btn btn-outline btn-lg"><i class="fa-solid fa-arrow-left"></i> Go Back</a>
  </div>



</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollToPlugin.min.js"></script>
<script src="js/main.js"></script>
</body>
</html>
